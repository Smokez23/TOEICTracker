<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TOEIC Daily Tracker</title>

<style>
/* Layout: sticky tab bar over a single working column; OMR answer-sheet bubbles are the signature detail. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --ink:#0F1B33; --muted:#5A6781; --line:#D8E0EC;
  --accent:#2447F5; --accent-ink:#FFFFFF; --accent-soft:#E4EAFF;
  --mark:#FFE14A; --mark-ink:#2A2300;
  --good:#12805C; --good-soft:#DDF3EA; --bad:#C2302A; --bad-soft:#FBE3E1;
  --c-grammar:#2447F5; --c-wordform:#7A5CFA; --c-vocab:#0F9C78; --c-part6:#E8781A; --c-part7:#E2487A;
  --hero-a:#0E1B52; --hero-b:#2447F5; --ban-a:#0F7A58; --ban-b:#2447F5;
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --surface:#141C30; --ink:#E8EDF8; --muted:#94A1BD; --line:#26324F;
  --accent:#7F99FF; --accent-ink:#0B1120; --accent-soft:#1C2850;
  --mark:#F2D13A; --mark-ink:#241E00;
  --good:#46D3A0; --good-soft:#12342B; --bad:#FF8078; --bad-soft:#3A1B1D;
  --c-grammar:#7F99FF; --c-wordform:#A18CFF; --c-vocab:#3CCB9F; --c-part6:#FF9A4D; --c-part7:#FF7BA3;
  --hero-a:#101A44; --hero-b:#2B40BC; --ban-a:#0E6B4C; --ban-b:#2B40BC; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#141C30; --ink:#E8EDF8; --muted:#94A1BD; --line:#26324F;
  --accent:#7F99FF; --accent-ink:#0B1120; --accent-soft:#1C2850;
  --mark:#F2D13A; --mark-ink:#241E00;
  --good:#46D3A0; --good-soft:#12342B; --bad:#FF8078; --bad-soft:#3A1B1D;
  --c-grammar:#7F99FF; --c-wordform:#A18CFF; --c-vocab:#3CCB9F; --c-part6:#FF9A4D; --c-part7:#FF7BA3;
  --hero-a:#101A44; --hero-b:#2B40BC; --ban-a:#0E6B4C; --ban-b:#2B40BC; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;background-image:radial-gradient(700px 260px at 90% -40px,color-mix(in srgb,var(--accent) 12%,transparent),transparent);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
.wrap{max-width:880px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:52px}
.brand{font-weight:700;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--c-grammar),var(--c-wordform),var(--c-part7),var(--c-part6),var(--c-vocab),var(--c-grammar));box-shadow:inset 0 0 0 5px var(--surface)}
header.bar::after{content:"";display:block;height:3px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:linear-gradient(90deg,var(--c-grammar),var(--c-wordform),var(--c-part7),var(--c-part6),var(--c-vocab))}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--muted);text-decoration:none;padding:14px 10px;white-space:nowrap;font-weight:500;border-bottom:3px solid transparent;position:relative}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav a .dot{position:absolute;top:10px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--mark);box-shadow:0 0 0 1.5px var(--surface)}
a:focus-visible,button:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
main{padding-top:24px;display:grid;gap:20px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:19px;margin:0 0 4px;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.stack{display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
button,.btn{font:600 15px/1 var(--font);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.pill{display:inline-block;font:500 12px/1 var(--mono);padding:5px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--mark);color:var(--mark-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.big{font:600 clamp(34px,8vw,52px)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* gauge */
.gauge{position:relative;height:56px;margin:26px 0 8px}
.gauge .track{position:absolute;left:0;right:0;top:24px;height:10px;border-radius:99px;background:var(--line)}
.gauge .fill{position:absolute;left:0;top:24px;height:10px;border-radius:99px;background:var(--accent)}
.gauge .band{position:absolute;top:18px;height:22px;background:var(--mark);border-radius:4px;opacity:.95}
.gauge .tag{position:absolute;top:0;transform:translateX(-50%);font:500 11px/1 var(--mono);white-space:nowrap}
.gauge .tag.t{color:var(--muted);top:42px}
.gauge .me{position:absolute;top:19px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--accent);transform:translateX(-50%)}
/* quiz */
.qhead{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding:10px 0;display:grid;gap:8px}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog>div{height:100%;background:var(--accent);transition:width .25s}
.qsplit{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.qsplit.has-pass{grid-template-columns:1fr 1fr;align-items:start}.qsplit .pass{position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto}}
.pass{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:16px;white-space:pre-wrap;font-size:14.5px;line-height:1.7;min-width:0}
.blank{white-space:nowrap;background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:3px;font-family:var(--mono);font-size:13px}
.tg{display:grid;gap:4px;justify-content:start;text-align:left;padding:16px;min-height:96px;align-content:start}
.tg[aria-pressed="true"],.tgb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.tbl{border-collapse:collapse;width:100%;font-size:14px;min-width:760px}.tbl th{text-align:left;font:500 12px var(--mono);color:var(--muted);padding:8px;white-space:nowrap}.tbl td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
.qtext{font-size:17px;line-height:1.6;margin:8px 0 16px;min-width:0;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;font-weight:500;padding:12px 14px;line-height:1.45;min-height:52px;justify-content:flex-start;background:var(--surface)}
.opt .bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font:500 13px/1 var(--mono);color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.expl{border-left:4px solid var(--mark);padding:10px 14px;background:var(--bg);border-radius:0 8px 8px 0}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.palette button{padding:0;min-height:38px;font:500 13px var(--mono)}
.palette button.ans{background:var(--accent-soft);border-color:var(--accent)}
.palette button.cur{outline:3px solid var(--mark);outline-offset:1px}
/* bars */
.bars{display:grid;gap:12px}
.bar2{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar2 .t{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar2 .t>i{display:block;height:100%}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:340px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--line);display:block}
.heat i.l1{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.heat i.l2{background:var(--accent);opacity:.65}
.heat i.l3{background:var(--accent)}
svg text{fill:var(--muted);font:11px var(--mono)}
svg .gl{stroke:var(--line);stroke-width:1}
svg .bandr{fill:var(--mark);opacity:.9}
svg .ln{stroke:var(--accent);stroke-width:2.5;fill:none}
svg .pt{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.chart{overflow-x:auto}
.notice{padding:12px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.notice.warn{background:var(--bad-soft)}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list li{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:0}
.tick{display:grid;grid-template-columns:22px 1fr;gap:10px}
.tick b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.tick.done b{background:var(--good);border-color:var(--good);color:var(--surface)}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border-radius:14px;padding:24px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,63,.38),transparent 65%)}
.hero>*{position:relative;min-width:0}
.hero h1{color:#fff}.hero .muted{color:rgba(255,255,255,.86)}.hero .label{color:rgba(255,255,255,.78)}
.hero button.ghost{color:#fff;border:1px solid rgba(255,255,255,.45);min-height:32px;padding:4px 10px;font-size:13px}
.hero-art{width:min(240px,34vw);height:auto}
.ico{flex:none;display:block}
.steps{display:flex;gap:3px;align-items:flex-end;height:22px}
.steps i{width:8px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--c)}
.pill.cat{background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface));color:var(--ink)}
.pill.cat::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px}
.qcard{border-top:4px solid var(--c)}
.bar2 .t>i{background:var(--c,var(--accent))}.bar2 .t>i.low{background:var(--bad)}
.bar2>span:first-child::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:8px}
.banner{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:10px;color:#fff;background:linear-gradient(100deg,var(--ban-a),var(--ban-b));font-weight:600}
.conf{display:flex;gap:5px;flex:none}.conf i{width:10px;height:10px;border-radius:50%}
.conf i:nth-child(1){background:#FFD23F}.conf i:nth-child(2){background:#FF7BA3;border-radius:2px;transform:rotate(20deg)}.conf i:nth-child(3){background:#7FE3C3}
.tg{border-top:4px solid var(--c)}
.empty{display:flex;gap:16px;align-items:center}
@media(max-width:620px){.hero{grid-template-columns:1fr}.hero-art{width:190px;justify-self:end;margin-top:-6px}}
@media(max-width:520px){.bar2{grid-template-columns:90px 1fr 40px}.card{padding:16px}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

{id:"g08",cat:"grammar",lv:1,q:"If the supplier ------ the deadline, we will cancel the contract.",o:["miss","missed","misses","will miss"],a:2,e:"Conditional แบบที่ 1: If + Present Simple, ... will + V1 (supplier เอกพจน์ → misses)"},

{id:"g10",cat:"grammar",lv:1,q:"Mr. Kim has worked here ------ 2015.",o:["for","since","during","from"],a:1,e:"since + จุดเวลาในอดีต ใช้กับ Present Perfect"},

{id:"g16",cat:"wordform",lv:1,q:"Only ------ employees may enter the laboratory.",o:["authorize","authorized","authorizing","authorization"],a:1,e:"ขยายนาม employees → adjective (V3 แบบ passive) = authorized"},
{id:"g17",cat:"wordform",lv:1,q:"Ms. Lee is one of the most ------ designers in the industry.",o:["creativity","create","creative","creatively"],a:2,e:"most + adjective + noun → creative"},

{id:"g19",cat:"grammar",lv:2,q:"Mr. Park, ------ office is on the third floor, will lead the training.",o:["who","whom","whose","which"],a:2,e:"แสดงความเป็นเจ้าของ (his office) → whose"},

{id:"g21",cat:"grammar",lv:3,q:"By next June, the company ------ in this city for twenty years.",o:["operates","has operated","will have operated","operated"],a:2,e:"By + เวลาในอนาคต + for ... years → Future Perfect (will have + V3)"},

];

const KEY='toeic750.v1';
const CAT={grammar:'ไวยากรณ์',wordform:'รูปคำ (Word form)',vocab:'ศัพท์ / สำนวน',part6:'Part 6 เติมข้อความ',part7:'Part 7 อ่านจับใจความ'};
const CATS=Object.keys(CAT);
const W={1:1,2:1.5,3:2};
const MAP=[[0,5],[.3,150],[.45,230],[.6,300],[.7,350],[.78,395],[.85,430],[.93,470],[1,495]];
const BASE=[...BANK_GRAMMAR,...BANK_VOCAB,...BANK_READING];
const TARGETS=[[500,550,'ปูพื้นฐานให้แน่น'],[600,650,'พื้นฐานใช้งานได้'],[700,750,'ระดับกลางค่อนสูง'],[750,800,'ทำงานได้คล่อง (ค่าเริ่มต้น)'],[850,900,'ระดับสูง'],[900,990,'ใกล้เต็ม เน้นความแม่นยำ']];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const diffDays=(a,b)=>{const p=k=>{const [y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function fresh(){return{v:1,updated:0,target:[750,800],targetSet:false,attempts:[],seen:{},mist:{},ai:[],daily:{},session:null}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)return Object.assign(fresh(),o)}}catch(e){}return fresh()}
let S=load();
let dbDoc=null,dbBusy=false,dbAgain=false,dbState='local';
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function commit(){S.updated=Date.now();saveLocal();pushDb()}
async function pushDb(){
  if(!dbDoc)return; if(dbBusy){dbAgain=true;return}
  dbBusy=true;
  try{const copy=Object.assign({},S,{session:null});await dbDoc.set(copy);dbState='synced'}catch(e){dbState='local'}
  dbBusy=false; if(dbAgain){dbAgain=false;pushDb()}
  if(typeof renderSync==='function')renderSync();
}
async function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    const u=await claude.use('user'); const db=await claude.use('db'); if(!u||!db)return;
    const id=await u.id(); if(!id)return;
    dbDoc=db.doc('data/users/'+id+'/progress');
    const snap=await dbDoc.get();
    if(snap.exists){const d=snap.data(); if(d&&d.v===1&&(d.updated||0)>(S.updated||0)){S=Object.assign(fresh(),d,{session:S.session});saveLocal()}}
    else if(S.updated){pushDb()}
    dbState='synced'; if(typeof renderAll==='function')renderAll();
  }catch(e){dbDoc=null;dbState='local'}
}

/* ----- question access ----- */
function allQ(){return BASE.concat(S.ai)}
function qById(id){return allQ().find(q=>q.id===id)}
function unitsOf(qs){
  const m=new Map(),out=[];
  for(const q of qs){ if(q.pid){ if(!m.has(q.pid)){const u={pid:q.pid,qs:[]};m.set(q.pid,u);out.push(u)} m.get(q.pid).qs.push(q)} else out.push({qs:[q]}) }
  return out;
}
const seenN=q=>(S.seen[q.id]||{}).n||0;
const unitSeen=u=>Math.min(...u.qs.map(seenN));
function dueMistakes(){const t=dkey();return Object.keys(S.mist).filter(id=>S.mist[id].due<=t&&qById(id))}

/* build a question set. kind: placement | weekly | daily */
function buildSet(kind){
  const pool=unitsOf(allQ()); const take=[]; let shortfall=0;
  const rank=us=>shuffle(us).sort((a,b)=>unitSeen(a)-unitSeen(b));
  if(kind==='daily'){
    const ids=shuffle(dueMistakes()).slice(0,3); ids.forEach(id=>take.push({qs:[qById(id)],rev:true}));
    const used=new Set(ids); let n=take.length;
    const cand=rank(pool.filter(u=>!u.qs.some(q=>used.has(q.id))));
    const unseen=cand.filter(u=>unitSeen(u)===0);
    let i=0; for(const u of cand){ if(n>=10)break; take.push(u); n+=u.qs.length; i++ }
    const fresh=unseen.reduce((a,u)=>a+u.qs.length,0); shortfall=Math.max(0,10-3-fresh)>0?Math.max(0,(10-take.filter(t=>t.rev).length)-fresh):0;
  }else{
    const p6=rank(pool.filter(u=>u.pid&&u.pid.startsWith('p6'))).slice(0,2);
    const p7=rank(pool.filter(u=>u.pid&&u.pid.startsWith('p7'))).slice(0,2);
    p6.concat(p7).forEach(u=>take.push(u));
    let n=take.reduce((a,u)=>a+u.qs.length,0);
    const singles=rank(pool.filter(u=>!u.pid)); const quota={1:9,2:11,3:7}; const got={1:0,2:0,3:0};
    for(const u of singles){const lv=u.qs[0].lv; if(n>=30)break; if(got[lv]<quota[lv]){take.push(u);got[lv]++;n++}}
    for(const u of singles){if(n>=30)break; if(!take.includes(u)){take.push(u);n++}}
    const freshN=take.reduce((a,u)=>a+(unitSeen(u)===0?u.qs.length:0),0); shortfall=Math.max(0,n-freshN);
    if(kind==='placement')shortfall=0;
  }
  const qs=[];shuffleUnits(take).forEach(u=>u.qs.forEach(q=>qs.push(q.id)));
  return{ids:qs,shortfall};
}
function shuffleUnits(t){
  const rev=t.filter(u=>u.rev),rest=t.filter(u=>!u.rev);
  const pass=rest.filter(u=>u.pid),sing=rest.filter(u=>!u.pid);
  return rev.concat(shuffle(sing),shuffle(pass)); // singles first, passage blocks last (TOEIC-like order)
}
function startSession(kind,ids){
  const perm={};ids.forEach(id=>perm[id]=shuffle([0,1,2,3]));
  S.session={kind,ids,perm,ans:{},checked:{},idx:0,start:Date.now(),date:dkey()};
  saveLocal();
}

/* ----- scoring ----- */
function estReading(pct){
  for(let i=1;i<MAP.length;i++){const[a,x]=MAP[i-1],[b,y]=MAP[i];if(pct<=b)return Math.round(x+(y-x)*((pct-a)/(b-a)))}
  return 495;
}
function levelOf(total){
  if(total<400)return{k:'ระดับเริ่มต้น',d:'ควรปูพื้นฐานไวยากรณ์และศัพท์ธุรกิจก่อน'};
  if(total<550)return{k:'ระดับพื้นฐาน',d:'เข้าใจเรื่องง่ายได้ ยังพลาดข้อที่ใช้ไวยากรณ์ซับซ้อน'};
  if(total<750)return{k:'ระดับกลาง',d:'ใกล้ถึงระดับทำงานได้ดี ต้องเก็บคะแนนข้อยากและเรื่องเวลา'};
  if(total<860)return{k:'ระดับทำงานได้คล่อง',d:'คะแนนอยู่ราว 750–855 รักษาระดับและเก็บข้อยากที่เหลือ'};
  return{k:'ระดับสูงมาก',d:'เกินเป้าหมาย เน้นความแม่นยำและความเร็ว'};
}
function grade(ids,ans,perm){
  let wc=0,wt=0,c=0;const cat={};CATS.forEach(k=>cat[k]=[0,0]);const wrong=[];
  ids.forEach(id=>{
    const q=qById(id);if(!q)return; const pick=ans[id]; const ok=pick===q.a; wt+=W[q.lv]||1;
    cat[q.cat]=cat[q.cat]||[0,0]; cat[q.cat][1]++;
    if(ok){wc+=W[q.lv]||1;c++;cat[q.cat][0]++}else wrong.push(id);
  });
  const pct=wt?wc/wt:0; const reading=estReading(pct);
  return{n:ids.length,c,pct,reading,total:reading*2,cat,wrong};
}
function recordAnswer(id,ok){
  const s=S.seen[id]||{n:0,c:0};s.n++;if(ok)s.c++;s.last=dkey();S.seen[id]=s;
  const BOX=[1,3,7,14]; const m=S.mist[id];
  if(!ok){S.mist[id]={box:0,due:addDays(dkey(),1)}}
  else if(m){m.box++; if(m.box>=BOX.length)delete S.mist[id]; else m.due=addDays(dkey(),BOX[m.box])}
}
function finishSession(){
  const ss=S.session;if(!ss)return null;
  const g=grade(ss.ids,ss.ans);
  ss.ids.forEach(id=>{const q=qById(id);if(q)recordAnswer(id,ss.ans[id]===q.a)});
  const at={kind:ss.kind,date:dkey(),ts:Date.now(),n:g.n,c:g.c,pct:g.pct,reading:g.reading,total:g.total,cat:g.cat,secs:Math.round((Date.now()-ss.start)/1000)};
  S.attempts.push(at);
  const d=S.daily[ss.date]||{n:0,c:0};d.n+=g.n;d.c+=g.c;S.daily[ss.date]=d;
  S.session=null;commit();
  return{at,g,ids:ss.ids,ans:ss.ans,perm:ss.perm};
}
const tests=()=>S.attempts.filter(a=>a.kind==='placement'||a.kind==='weekly');
const lastTest=()=>tests().slice(-1)[0];
function weeklyDue(){const t=lastTest();if(!t)return false;return diffDays(t.date,dkey())>=7}
function streak(){let n=0,k=dkey();if(!(S.daily[k]&&S.daily[k].n))k=addDays(k,-1);while(S.daily[k]&&S.daily[k].n){n++;k=addDays(k,-1)}return n}
function weakCats(){
  const t={};CATS.forEach(k=>t[k]=[0,0]);
  Object.keys(S.seen).forEach(id=>{const q=qById(id);if(q){t[q.cat][0]+=S.seen[id].c;t[q.cat][1]+=S.seen[id].n}});
  return CATS.filter(k=>t[k][1]>=3).sort((a,b)=>t[a][0]/t[a][1]-t[b][0]/t[b][1]);
}

/* ----- AI generation (Claude via the viewer's account) ----- */
async function genAI(count,onState){
  const sample=await (window.claude&&claude.use?claude.use('sample'):null);
  if(!sample)throw{code:'unavailable'};
  const weak=weakCats().filter(k=>['grammar','wordform','vocab'].includes(k)).slice(0,2).map(k=>CAT[k]);
  const recent=allQ().slice(-25).map(q=>q.q).join(' | ').slice(0,1800);
  const tg=S.target[0],band=tg>=850?'TOEIC 800-990 level (mostly lv 3, a few lv 2)':tg>=700?'TOEIC 650-850 level (mostly lv 2 and 3, a few lv 1)':tg>=600?'TOEIC 500-700 level (mostly lv 1 and 2, a few lv 3)':'TOEIC 300-550 level (mostly lv 1, some lv 2)';
  const prompt='You are a TOEIC Reading item writer. Write '+count+' NEW, original Part 5 style incomplete-sentence questions (one blank shown as ------) in business contexts (office, HR, finance, shipping, travel, customer service, meetings). '
   +'Match this learner target: '+band+'. Categories: "grammar", "wordform", "vocab". '+(weak.length?'Emphasize these weaker areas where natural: '+weak.join(', ')+'. ':'')
   +'Each item must have exactly one clearly correct option and three plausible distractors. Do not repeat these existing stems: '+recent+'\n'
   +'Reply with only a JSON array. Each element: {"cat":"grammar|wordform|vocab","lv":1|2|3,"q":"sentence with ------","o":["opt1","opt2","opt3","opt4"],"a":0-3 index of the correct option,"e":"explanation in Thai, 1-2 short sentences, mention the rule or the meaning"}.';
  onState&&onState('Claude กำลังคิดโจทย์...');
  const arr=await sample.json(prompt,{modelTier:'default',cache:false});
  if(!Array.isArray(arr))throw{code:'invalid_json'};
  const have=new Set(allQ().map(q=>q.q.toLowerCase()));let added=0;
  arr.forEach((x,i)=>{
    if(!x||typeof x.q!=='string'||!Array.isArray(x.o)||x.o.length!==4||!Number.isInteger(x.a)||x.a<0||x.a>3||typeof x.e!=='string')return;
    if(!x.q.includes('------')||have.has(x.q.toLowerCase()))return;
    if(new Set(x.o.map(s=>String(s).trim().toLowerCase())).size!==4)return;
    const cat=['grammar','wordform','vocab'].includes(x.cat)?x.cat:'grammar';const lv=[1,2,3].includes(x.lv)?x.lv:2;
    S.ai.push({id:'ai'+Date.now().toString(36)+i,cat,lv,q:x.q.slice(0,400),o:x.o.map(s=>String(s).slice(0,120)),a:x.a,e:x.e.slice(0,400),ai:1});added++;
  });
  if(S.ai.length>150)S.ai=S.ai.slice(-150);
  commit();return added;
}

  const st=$('#genst'),btn=$('#genbtn'),b1=$('#g1');if(btn)btn.disabled=true;if(b1)b1.disabled=true;
  try{const n=await genAI(10,t=>{if(st)st.textContent=t});if(st)st.textContent=`เพิ่มโจทย์ใหม่ ${n} ข้อแล้ว`;if(btn)btn.disabled=false;if(after&&n>0)after()}
  catch(e){const m={not_granted:'ยังไม่ได้อนุญาตให้แอปใช้ Claude',rate_limited:'ใช้บ่อยเกินไป รอสักครู่แล้วลองใหม่',invalid_json:'Claude ตอบรูปแบบไม่ถูกต้อง ลองกดอีกครั้ง',unavailable:'มุมมองนี้ใช้ Claude ไม่ได้ ใช้คลังโจทย์ในแอปไปก่อน',sampling_disabled:'บัญชีนี้ใช้ Claude ในหน้านี้ไม่ได้'}[e&&e.code]||'สร้างโจทย์ไม่สำเร็จ ลองใหม่อีกครั้ง';
    if(st)st.textContent=m;if(btn){btn.disabled=false}if(b1)b1.disabled=false}
}

/* ----- quiz ----- */
function viewQuiz(){
  const ss=S.session,id=ss.ids[ss.idx],q=qById(id),test=ss.kind!=='daily',perm=ss.perm[id],n=ss.ids.length;
  const pick=ss.ans[id],checked=!test&&ss.checked[id];
  const pass=q.pid?BANK_PASSAGES[q.pid]:null;
  const limit=ss.kind==='placement'?35*60:ss.kind==='weekly'?30*60:0;
  app().innerHTML=`
  <div class="qhead"><div class="row sp"><span class="label">${{placement:'วัดระดับ',weekly:'สอบรายสัปดาห์',daily:'ฝึกประจำวัน'}[ss.kind]} · ข้อ ${ss.idx+1}/${n}</span>
    <span class="mono" id="timer">${limit?'':''}</span></div><div class="prog"><div style="width:${(ss.idx+(checked?1:0))/n*100}%"></div></div></div>
  <div class="qsplit ${pass?'has-pass':''}">
    ${pass?`<div class="pass"><span class="label">${esc(pass.title)}</span>\n\n${esc(pass.text).replace(/\((\d)\) -{6}/g,'<span class="blank">($1) ______</span>')}</div>`:''}
    <div class="card qcard" style="min-width:0;--c:var(--c-${q.cat})"><span class="pill cat">${CAT[q.cat]}</span>${S.mist[id]&&!test?' <span class="pill warn">ทบทวน</span>':''}
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts" role="group" aria-label="ตัวเลือก">${perm.map((oi,pos)=>{
        let cls='';if(checked){if(oi===q.a)cls='right';else if(oi===pick)cls='wrong'}
        return `<button class="opt ${cls}" data-oi="${oi}" aria-pressed="${pick===oi}" ${checked?'disabled':''}><span class="bub">${'ABCD'[pos]}</span><span>${esc(q.o[oi])}</span></button>`}).join('')}</div>
      ${checked?`<div class="expl" style="margin-top:16px"><strong>${pick===q.a?'ถูกต้อง':'คำตอบที่ถูกคือ '+'ABCD'[perm.indexOf(q.a)]}</strong><br>${esc(q.e)}</div>`:''}
      <div class="row sp" style="margin-top:18px">
        ${test?`<button id="prev" ${ss.idx===0?'disabled':''}>ย้อนกลับ</button>`:'<span></span>'}
        ${test?(ss.idx<n-1?`<button class="primary" id="next">ข้อถัดไป</button>`:`<button class="primary" id="submit">ส่งข้อสอบ</button>`)
          :(!checked?`<button class="primary" id="check" ${pick==null?'disabled':''}>ตรวจคำตอบ</button>`:(ss.idx<n-1?`<button class="primary" id="next">ข้อถัดไป</button>`:`<button class="primary" id="submit">จบและดูผล</button>`))}
      </div></div></div>
  ${test?`<div class="card stack"><span class="label">แผนที่ข้อสอบ (${Object.keys(ss.ans).length}/${n} ตอบแล้ว)</span><div class="palette">${ss.ids.map((x,i)=>`<button data-i="${i}" class="${ss.ans[x]!=null?'ans':''} ${i===ss.idx?'cur':''}" aria-label="ข้อ ${i+1}">${i+1}</button>`).join('')}</div></div>`:''}
  <div class="row"><button class="ghost" id="quit">ออกไปก่อน (เก็บความคืบหน้าไว้)</button></div>`;
  app().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ss.ans[id]=+b.dataset.oi;saveLocal();viewQuiz()});
  const nx=$('#next'),pv=$('#prev'),ck=$('#check'),sb=$('#submit');
  if(nx)nx.onclick=()=>{ss.idx++;saveLocal();viewQuiz();window.scrollTo(0,0)};
  if(pv)pv.onclick=()=>{ss.idx--;saveLocal();viewQuiz();window.scrollTo(0,0)};
  if(ck)ck.onclick=()=>{ss.checked[id]=1;saveLocal();viewQuiz()};
  if(sb)sb.onclick=()=>{ if(test){const un=n-Object.keys(ss.ans).length;if(un>0&&!sb.dataset.sure){sb.dataset.sure=1;sb.textContent=`ยังไม่ตอบ ${un} ข้อ กดอีกครั้งเพื่อส่ง`;return}}submit()};
  app().querySelectorAll('.palette button').forEach(b=>b.onclick=()=>{ss.idx=+b.dataset.i;saveLocal();viewQuiz();window.scrollTo(0,0)});
  $('#quit').onclick=()=>{saveLocal();go('home')};
  if(limit){const tick=()=>{const left=limit-Math.floor((Date.now()-ss.start)/1000),el=$('#timer');if(!el)return;
    if(left<=0){clearInterval(timerH);submit();return}
    el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');el.style.color=left<300?'var(--bad)':'var(--muted)'};tick();timerH=setInterval(tick,1000)}
}
function submit(){clearInterval(timerH);const r=finishSession();if(!r)return;result=r;renderAll();window.scrollTo(0,0)}

/* ----- result ----- */
function bars(cat){
  return `<div class="bars">${CATS.filter(k=>cat[k]&&cat[k][1]).map(k=>{const [c,t]=cat[k],p=Math.round(c/t*100);
    return `<div class="bar2" style="--c:var(--c-${k})"><span>${CAT[k]}</span><div class="t"><i class="${p<60?'low':''}" style="width:${p}%"></i></div><span class="mono">${c}/${t}</span></div>`}).join('')}</div>`;
}
function viewResult(){
  const {at,g,ids,ans,perm}=result,test=at.kind!=='daily',lv=levelOf(at.total);
  const prev=tests().slice(0,-1).slice(-1)[0],delta=test&&prev&&at!==prev?at.total-prev.total:null;
  const weak=CATS.filter(k=>g.cat[k][1]>=2).sort((a,b)=>g.cat[a][0]/g.cat[a][1]-g.cat[b][0]/g.cat[b][1])[0];
  app().innerHTML=`<div class="stack"><span class="label">ผล${{placement:'วัดระดับ',weekly:'สอบรายสัปดาห์',daily:'ฝึกประจำวัน'}[at.kind]}</span>
    <h1>ถูก ${g.c} จาก ${g.n} ข้อ</h1></div>
  ${(()=>{const m=test&&at.total>=S.target[0]?'ถึงเป้า '+tgtLabel()+' แล้ว รักษาระดับด้วยการฝึกทุกวัน':(delta!=null&&delta>0?'คะแนนเพิ่มขึ้น '+delta+' จากครั้งก่อน ไปต่อเลย':(!test&&g.pct>=.8?'ฝึกวันนี้ได้ดีมาก':''));return m?`<div class="banner"><span class="conf" aria-hidden="true"><i></i><i></i><i></i></span><span>${m}</span></div>`:''})()}
  ${test?`<div class="card">${gauge(at.total)}<div class="row sp"><div><span class="label">คะแนนรวมโดยประมาณ</span><div class="big">${at.total}</div></div>
    <div><span class="label">Reading โดยประมาณ</span><div class="big">${at.reading}</div></div>
    ${delta!=null?`<div><span class="label">เทียบครั้งก่อน</span><div class="big" style="color:${delta>=0?'var(--good)':'var(--bad)'}">${delta>=0?'+':''}${delta}</div></div>`:''}</div>
    <p style="margin-top:12px"><span class="pill ${at.total>=S.target[0]?'good':'warn'}">${lv.k}</span> <span class="muted">${lv.d}</span></p>
    <p class="muted" style="font-size:13px;margin-top:8px">ตัวเลขนี้เป็นการประมาณจากข้อสอบ Reading 30 ข้อ (ข้อยากให้น้ำหนักมากกว่า) ไม่ใช่คะแนน TOEIC จริง ใช้เทียบความก้าวหน้าของตัวเองเป็นหลัก</p></div>`:''}
  <div class="card stack"><h2>แยกตามหมวด</h2>${bars(g.cat)}${weak?`<div class="notice">หมวดที่ควรเน้น: <strong>${CAT[weak]}</strong> ข้อที่ผิดถูกใส่ในสมุดข้อผิดแล้ว จะกลับมาให้ทบทวนตามรอบ</div>`:''}</div>
  <div class="card stack"><h2>เฉลยทุกข้อ</h2><ul class="list">${ids.map((id,i)=>{const q=qById(id),ok=ans[id]===q.a,p=perm[id];
    return `<li><div class="row"><span class="mono muted">${i+1}.</span><span class="pill ${ok?'good':'bad'}">${ok?'ถูก':ans[id]==null?'ไม่ได้ตอบ':'ผิด'}</span></div>
    <div>${esc(q.q)}</div><div class="muted">เฉลย: <strong style="color:var(--ink)">${esc(q.o[q.a])}</strong>${!ok&&ans[id]!=null?` · คุณตอบ: ${esc(q.o[ans[id]])}`:''}</div><div class="expl">${esc(q.e)}</div></li>`}).join('')}</ul></div>
  <div class="row"><a class="btn primary" href="#home" id="rh">กลับหน้าภาพรวม</a><a class="btn" href="#progress">ดูกราฟความก้าวหน้า</a></div>`;
  $('#rh').onclick=e=>{e.preventDefault();result=null;go('home')};
}

/* ----- review (mistake notebook) ----- */
function viewReview(){
  const ids=Object.keys(S.mist).filter(qById),t=dkey();
  const due=ids.filter(i=>S.mist[i].due<=t);
  app().innerHTML=`<div class="stack"><span class="label">สมุดข้อผิด</span><h1>${ids.length} ข้อที่ต้องจำให้ได้</h1><p class="muted">ถึงรอบทบทวนแล้ว ${due.length} ข้อ ตอบถูกต่อเนื่อง 4 รอบ (1, 3, 7, 14 วัน) ข้อนั้นจะออกจากสมุด</p></div>
  ${ids.length?`<div class="card stack"><ul class="list">${ids.sort((a,b)=>S.mist[a].due.localeCompare(S.mist[b].due)).map(id=>{const q=qById(id),m=S.mist[id];
    return `<li><div class="row"><span class="pill cat" style="--c:var(--c-${q.cat})">${CAT[q.cat]}</span><span class="pill ${m.due<=t?'warn':''}">${m.due<=t?'ถึงรอบแล้ว':'ทบทวน '+m.due}</span></div><div>${esc(q.q)}</div>${q.pid?`<div class="muted" style="font-size:13px">จากบทอ่าน: ${esc(BANK_PASSAGES[q.pid].title)}</div>`:''}<div class="muted">เฉลย: <strong style="color:var(--ink)">${esc(q.o[q.a])}</strong></div><div class="expl">${esc(q.e)}</div></li>`}).join('')}</ul></div>`
  :`<div class="card empty">${ico('book',56)}<p>ยังไม่มีข้อผิดในสมุด ทำข้อสอบหรือฝึกประจำวัน ข้อที่ตอบผิดจะมาอยู่ที่นี่</p></div>`}
  ${due.length?`<div class="row"><a class="btn primary" href="#daily">ทบทวนผ่านชุดฝึกวันนี้</a></div>`:''}`;
}

/* ----- progress ----- */
function chartSvg(){
  const ts=tests();if(!ts.length)return `<p class="muted">ยังไม่มีข้อมูล ทำข้อสอบวัดระดับก่อนเพื่อเริ่มกราฟ</p>`;
  const W_=640,H=260,L=44,R=16,T=14,B=34,lo=Math.min(300,...ts.map(t=>t.total))-0,hi=990;
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo)),x=i=>ts.length===1?(L+W_-R)/2:L+(W_-L-R)*i/(ts.length-1);
  const ticks=[lo,500,750,990].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b);
  const lbl=ts.length>8?(i=>i%Math.ceil(ts.length/8)===0):()=>true;
  return `<svg viewBox="0 0 ${W_} ${H}" width="100%" style="min-width:420px" role="img" aria-label="กราฟคะแนนประมาณรายครั้ง เทียบเป้า ${tgtLabel()}">
   <rect class="bandr" x="${L}" y="${y(S.target[1])}" width="${W_-L-R}" height="${Math.max(4,y(S.target[0])-y(S.target[1]))}"/>
   ${ticks.map(v=>`<line class="gl" x1="${L}" x2="${W_-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}
   <text x="${W_-R}" y="${y(S.target[1])-5}" text-anchor="end">เป้า ${tgtLabel()}</text>
   <polyline class="ln" points="${ts.map((t,i)=>x(i)+','+y(t.total)).join(' ')}"/>
   ${ts.map((t,i)=>`<circle class="pt" cx="${x(i)}" cy="${y(t.total)}" r="5"/><text x="${x(i)}" y="${y(t.total)-11}" text-anchor="middle">${t.total}</text>${lbl(i)?`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${t.kind==='placement'?'เริ่ม':'W'+i}</text>`:''}`).join('')}
  </svg>`;
}
function viewProgress(){
  const ts=tests(),cat={};CATS.forEach(k=>cat[k]=[0,0]);
  Object.keys(S.seen).forEach(id=>{const q=qById(id);if(q){cat[q.cat][0]+=S.seen[id].c;cat[q.cat][1]+=S.seen[id].n}});
  const days=[];for(let i=34;i>=0;i--){const k=addDays(dkey(),-i),n=(S.daily[k]||{}).n||0;days.push([k,n])}
  const tot=Object.values(S.daily).reduce((a,d)=>a+d.n,0),act=Object.values(S.daily).filter(d=>d.n).length;
  app().innerHTML=`<div class="stack"><span class="label">ความก้าวหน้า</span><h1>${ts.length?'คะแนนประมาณจาก '+ts[0].total+' เป็น '+ts[ts.length-1].total:'ยังไม่มีข้อมูล'}</h1></div>
  <div class="card stack"><h2>คะแนนประมาณรายครั้ง</h2><div class="chart">${chartSvg()}</div>
   ${ts.length?`<table style="border-collapse:collapse;width:100%;font-size:14px"><thead><tr class="muted" style="text-align:left"><th>วันที่</th><th>ชนิด</th><th>ถูก</th><th>รวม</th></tr></thead><tbody>${ts.slice().reverse().map(t=>`<tr style="border-top:1px solid var(--line)"><td class="mono">${t.date}</td><td>${t.kind==='placement'?'วัดระดับ':'รายสัปดาห์'}</td><td class="mono">${t.c}/${t.n}</td><td class="mono"><strong>${t.total}</strong></td></tr>`).join('')}</tbody></table>`:''}</div>
  <div class="card stack"><h2>ความแม่นยำสะสมแต่ละหมวด</h2>${bars(cat)}<p class="muted" style="font-size:13px">รวมทุกครั้งที่ตอบ ทั้งฝึกประจำวันและข้อสอบ</p></div>
  <div class="card stack"><h2>วันที่ฝึก 5 สัปดาห์ล่าสุด</h2><div class="heat" role="img" aria-label="ปฏิทินการฝึก">${days.map(([k,n])=>`<i class="${n>=10?'l3':n>=5?'l2':n>0?'l1':''}" title="${k}: ${n} ข้อ"></i>`).join('')}</div>
   <p class="muted">ฝึกแล้ว ${act} วัน รวม ${tot} ข้อ · ต่อเนื่องล่าสุด ${streak()} วัน</p></div>
  <div class="card stack"><h2>เป้าหมายคะแนน</h2>
   <div class="row" id="tgts">${TARGETS.map((t,k)=>`<button class="tgb" data-k="${k}" aria-pressed="${t[0]===S.target[0]&&t[1]===S.target[1]}">${tgtLabel(t)}</button>`).join('')}</div></div>
  <div class="card stack"><h2>ข้อมูลของคุณ</h2>
   <p class="muted">ข้อมูลเก็บ${dbState==='synced'?'ในบัญชีของคุณและในเครื่องนี้ แต่ละคนเห็นเฉพาะความคืบหน้าของตัวเอง':'ในเครื่องนี้ (ถ้าเปิดด้วยบัญชีที่ลงชื่อเข้าใช้และมีสิทธิ์บันทึก จะซิงก์ข้ามอุปกรณ์ได้)'}</p>
   <div class="row"><button id="rst">ล้างความคืบหน้าทั้งหมด</button></div></div><p class="muted" id="sync" style="font-size:13px"></p>`;
  app().querySelectorAll('.tgb').forEach(b=>b.onclick=()=>{S.target=TARGETS[+b.dataset.k].slice(0,2);S.targetSet=true;commit();viewProgress()});
  $('#rst').onclick=function(){if(!this.dataset.s){this.dataset.s=1;this.textContent='กดอีกครั้งเพื่อยืนยันการล้างข้อมูล';return}
    S=fresh();S.updated=Date.now();saveLocal();pushDb();go('home')};
}

/* ----- onboarding: choose target ----- */
function viewOnboard(){
  if(!pickT)pickT=S.target;
  const first=!S.targetSet;
  app().innerHTML=`<div class="stack"><span class="label">${first?'ขั้นแรก':'เปลี่ยนเป้าหมาย'}</span><h1>เลือกเป้าหมายคะแนน TOEIC</h1>
   <p class="muted">ใช้เทียบกับคะแนนประมาณในกราฟ แผนฝึก และระดับความยากของโจทย์ใหม่ที่ Claude สร้าง เปลี่ยนได้ทุกเมื่อ</p></div>
  <div class="grid" id="tgg">${TARGETS.map((t,k)=>`<button class="tg" style="--c:${TCOL[k]}" data-k="${k}" aria-pressed="${t[0]===pickT[0]&&t[1]===pickT[1]}"><span class="steps" aria-hidden="true">${[0,1,2,3,4,5].map(i=>`<i class="${i<=k?'on':''}" style="height:${6+i*3}px"></i>`).join('')}</span><span class="big" style="font-size:30px">${tgtLabel(t)}</span><span class="muted">${t[2]}</span></button>`).join('')}</div>
  <div class="row"><button class="primary" id="okt">${first?'เริ่มใช้งาน':'บันทึกเป้าหมาย'}</button>${first?'':'<button id="cnt">ยกเลิก</button>'}</div>`;
  app().querySelectorAll('.tg').forEach(b=>b.onclick=()=>{pickT=TARGETS[+b.dataset.k].slice(0,2);app().querySelectorAll('.tg').forEach(x=>x.setAttribute('aria-pressed',x===b))});

}

window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveLocal()});
route();initDb();
